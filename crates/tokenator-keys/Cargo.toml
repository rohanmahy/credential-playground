[package]
name = "tokenator-keys"
description = "Key model, PEM/JWK/COSE_Key conversion, thumbprints, key generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

# DER/PEM crates are the RustCrypto generation tokenator-crypto already pulls
# in (der 0.8, spki 0.8, pkcs8 0.11, sec1 0.8). pkcs1 0.8 is still a release
# candidate, like the rsa crate it belongs with. See TEST-PLAN.md.
[dependencies]
tokenator-cbor = { path = "../tokenator-cbor" }
tokenator-crypto = { path = "../tokenator-crypto" }
tokenator-json = { path = "../tokenator-json" }
base64ct = { version = "1.8", features = ["alloc"] }
der = { version = "0.8", features = ["alloc", "oid", "pem", "zeroize"] }
pem-rfc7468 = { version = "1", features = ["alloc"] }
pkcs1 = { version = "0.8.0-rc.5", default-features = false, features = ["alloc", "pem"] }
pkcs8 = { version = "0.11", features = ["alloc", "pem"] }
sec1 = { version = "0.8", default-features = false, features = ["der", "alloc", "pem"] }
spki = { version = "0.8", features = ["alloc", "pem"] }

[dev-dependencies]
hex = "0.4"
proptest = "1"
rand_chacha = { version = "0.10", default-features = false }
serde_json = "1"

[lints]
workspace = true
