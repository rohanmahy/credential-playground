[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"
repository = "https://github.com/rohanmahy/credential-playground"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
