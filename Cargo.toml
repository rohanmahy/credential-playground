[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"
repository = "https://github.com/rohanmahy/credential-playground"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

# The web build (`pnpm build:wasm` in app/): small rather than fast. Release
# settings for native builds (Tauri) are untouched.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
