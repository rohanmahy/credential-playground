# Every step is a plain command that also runs locally (README.md,
# "Building and testing").
#
# What runs when (#39):
#
#   event                      unit   Linux set   macOS
#   push to a branch (not main)  x        -          -     (skipped while the branch has an open PR)
#   pull_request                 -        x          -
#   push to main (a merge)       -        x          x
#   workflow_dispatch            -        x          x
#
# unit:      cargo test (Linux, all features, without tokenator-desktop
#            to stay fast) and the app's Vitest unit tests.
# Linux set: fmt; clippy, both test feature sets, and rustdoc for the whole
#            workspace including tokenator-desktop (WebKitGTK installed);
#            wasm32 builds; the app (typecheck, lint, Vitest, bindings
#            check, build, WASM parity, Playwright); desktop-e2e; fuzz smoke.
# macOS:     clippy and both test feature sets of the whole workspace.
#
# A push to a branch with an open PR also fires pull_request, whose Linux
# set includes the unit tests, so the unit job checks for an open PR and
# skips itself. Within one event and ref, a newer run cancels an older one
# (except on main, where every merge is tested to completion).
# Tags are left to release.yml.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Pushes to branches other than main: the unit tests only, unless the
  # branch has an open PR (whose pull_request run covers them).
  open-pr:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      count: ${{ steps.pr.outputs.count }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq length)
          echo "count=$n" >>"$GITHUB_OUTPUT"
          if [ "$n" -gt 0 ]; then
            echo "$GITHUB_REF_NAME has an open PR, which runs the full set; unit skipped." >>"$GITHUB_STEP_SUMMARY"
          fi

  unit:
    needs: open-pr
    if: needs.open-pr.outputs.count == '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: unit
      - run: cargo test --locked --workspace --exclude tokenator-desktop --all-features
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm test
        working-directory: app

  fmt:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check

  # Linux: the whole workspace, tokenator-desktop included (WebKitGTK).
  rust-linux:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/linux-deps.sh
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      # Default features too: tokenator-edn's feature-off tests are cfg-gated
      # against the `hash` tests (crates/tokenator-edn/TEST-PLAN.md).
      - run: cargo test --locked --workspace
      - name: rustdoc
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Only for merges to main (and manual runs): macOS minutes are costly.
  rust-macos:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace

  wasm:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: wasm32 build of the library crates
        run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p tokenator-cbor -p tokenator-json -p tokenator-crypto -p tokenator-registry
          -p tokenator-edn -p tokenator-keys -p tokenator-detect -p tokenator-jose
          -p tokenator-cose -p tokenator-core -p tokenator-wasm

  app:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # build:wasm (wasm-release profile) and the parity tool.
          shared-key: app
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-pack@0.15.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # svelte-check loads vite.config.ts, which needs the wasm package.
      - run: pnpm build:wasm
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:types
      - run: pnpm build
      - run: pnpm test:wasm
      - name: Playwright browsers
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:e2e --project chromium
        env:
          TOKENATOR_E2E: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: app/test-results
          retention-days: 7

  # The desktop app on Linux (WebKitGTK): the release binary, then the
  # WebdriverIO suite (app/e2e-desktop) against it through tauri-driver
  # under Xvfb (rust-linux covers its clippy and tests).
  # scripts/desktop-e2e-docker.sh runs the same steps locally in a container.
  desktop-e2e:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/linux-deps.sh --e2e
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: desktop
          # tauri-cli and tauri-driver below.
          cache-bin: true
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-pack@0.15.0
      # A no-op when the cached binaries already have these versions.
      - run: cargo install --locked tauri-cli@2.12.4 tauri-driver@2.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # target/release/tokenator, without incognito (app/e2e-desktop/build.mjs).
      - run: pnpm build:desktop-e2e
        working-directory: app
      - run: xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24' pnpm test:e2e:desktop
        working-directory: app
        env:
          TOKENATOR_E2E_OUT: ${{ runner.temp }}/desktop-e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-failures
          path: ${{ runner.temp }}/desktop-e2e
          retention-days: 7
          if-no-files-found: ignore

  # Each cargo-fuzz target for about 60 s from the testdata/ seeds, on the
  # pinned nightly (fuzz-nightly.yml runs longer, on the latest nightly).
  fuzz-smoke:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FUZZ_TOOLCHAIN: nightly-2026-02-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          cache-bin: true
      - run: cargo install --locked cargo-fuzz@0.13.2
      - run: cargo "+$FUZZ_TOOLCHAIN" fuzz build
      - run: fuzz/seed-corpora.sh
      - run: fuzz/smoke.sh 60
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts
            fuzz/logs
          retention-days: 14
