[package]
name = "parity"
description = "The WASM/native parity corpus: builds it, writes the native goldens, and replays it natively"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64ct = { version = "1.8", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokenator-cbor = { path = "../../crates/tokenator-cbor" }
tokenator-core = { path = "../../crates/tokenator-core" }

[lints]
workspace = true
